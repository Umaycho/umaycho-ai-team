name: AI Ekip

# Bir issue veya PR'da @claude yazıldığında ekibi çalıştırır.
on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  ekip:
    # Sadece @claude geçen olaylar; 3D işleri bulutta çalıştırma (lokal aşamada ayrı job eklenecek).
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    env:
      # Board güncellemesi ve GitHub MCP için "project" kapsamlı token.
      GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      GH_TOKEN: ${{ secrets.GITHUB_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/Umaycho/umaycho-ai-team.git"
          plugins: "agentic-team@ai-team"
          claude_args: >-
            --max-turns 80
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(bash:*),Bash(godot:*)"
